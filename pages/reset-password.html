<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003B46">
  <title>איפוס סיסמה — עסק ללא מתחרים</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/global-nav.css">
  <script>
    (function(){var t=localStorage.getItem('bwc-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
  <script src="../js/theme-toggle.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: 'Heebo', sans-serif;
      background: #03181c;
      color: #E8F1F2;
      -webkit-text-size-adjust: 100%;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0, 96, 107, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0, 59, 70, 0.22) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 4rem;
    }

    /* ===== Card ===== */
    .rp-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(15, 45, 45, 0.92) 0%, rgba(8, 30, 36, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(212, 175, 55, 0.07);
      padding: 2rem 1.75rem 1.75rem;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      animation: cardIn 0.4s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Logo / brand mark ===== */
    .rp-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.75rem;
      text-decoration: none;
    }

    .rp-logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #003B46 0%, #00606B 100%);
      border: 1px solid rgba(212, 175, 55, 0.25);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .rp-logo-icon svg {
      width: 22px;
      height: 22px;
      fill: #D4AF37;
    }

    .rp-logo-text {
      display: flex;
      flex-direction: column;
    }

    .rp-logo-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #E8F1F2;
      line-height: 1.2;
    }

    .rp-logo-sub {
      font-size: 0.75rem;
      color: rgba(232, 241, 242, 0.5);
    }

    /* ===== Heading ===== */
    .rp-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #E8F1F2;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .rp-subtitle {
      font-size: 0.9rem;
      color: rgba(232, 241, 242, 0.6);
      margin-bottom: 1.5rem;
      line-height: 1.55;
    }

    /* ===== Form ===== */
    .rp-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .rp-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .rp-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(232, 241, 242, 0.75);
    }

    .rp-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      color: #E8F1F2;
      font-family: inherit;
      font-size: 1rem;
      direction: ltr;
      text-align: right;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .rp-input:focus {
      outline: 0;
      border-color: #D4AF37;
      background: rgba(0, 0, 0, 0.42);
    }

    .rp-input::placeholder {
      color: rgba(232, 241, 242, 0.35);
    }

    /* ===== Submit button ===== */
    .rp-submit {
      margin-top: 0.25rem;
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, #D4AF37 0%, #E6C65A 50%, #D4AF37 100%);
      border: 0;
      border-radius: 10px;
      color: #1A2E2E;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.30);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .rp-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.40);
    }

    .rp-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .rp-submit:focus-visible {
      outline: 3px solid #E6C65A;
      outline-offset: 2px;
    }

    /* ===== Status ===== */
    .rp-status {
      min-height: 1.2rem;
      margin-top: 0.15rem;
      font-size: 0.9rem;
      text-align: center;
      color: #EF4444;
      line-height: 1.45;
    }

    .rp-status.is-success {
      color: #10B981;
    }

    /* ===== Error state (invalid link) ===== */
    .rp-error-state {
      text-align: center;
      padding: 1rem 0;
    }

    .rp-error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      font-size: 1.5rem;
    }

    .rp-error-state h2 {
      font-size: 1.15rem;
      color: #E8F1F2;
      margin-bottom: 0.5rem;
    }

    .rp-error-state p {
      font-size: 0.9rem;
      color: rgba(232, 241, 242, 0.6);
      margin-bottom: 1.25rem;
      line-height: 1.55;
    }

    .rp-link {
      display: inline-block;
      font-size: 0.9rem;
      color: #D4AF37;
      text-decoration: none;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding-bottom: 1px;
      transition: border-color 0.15s;
    }

    .rp-link:hover { border-color: #D4AF37; }

    /* ===== Loading spinner ===== */
    .rp-loading {
      text-align: center;
      padding: 1.5rem 0;
      color: rgba(232, 241, 242, 0.6);
      font-size: 0.9rem;
    }

    .rp-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Back link ===== */
    .rp-back {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(232, 241, 242, 0.5);
    }

    .rp-back a {
      color: rgba(232, 241, 242, 0.65);
      text-decoration: none;
      border-bottom: 1px solid rgba(232, 241, 242, 0.2);
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .rp-back a:hover {
      color: #E8F1F2;
      border-color: rgba(232, 241, 242, 0.5);
    }

    @media (max-width: 480px) {
      .rp-card {
        padding: 1.5rem 1.25rem 1.25rem;
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rp-card, .rp-submit, .rp-spinner { animation: none; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="gnav" data-page="reset-password"></header>

  <main class="page-wrap" id="main" tabindex="-1">
    <div class="rp-card" role="main">

      <!-- Brand logo -->
      <a class="rp-logo" href="../index.html" aria-label="חזרה לדף הבית">
        <div class="rp-logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="rp-logo-text">
          <span class="rp-logo-name">עסק ללא מתחרים</span>
          <span class="rp-logo-sub">מרכז ההכשרה</span>
        </div>
      </a>

      <!-- Loading state (shown while auth initialises) -->
      <div class="rp-loading" id="rpLoading" aria-live="polite">
        <div class="rp-spinner" role="status" aria-label="טוען…"></div>
        <span>מאמת את הקישור…</span>
      </div>

      <!-- Invalid-link error state (hidden by default) -->
      <div class="rp-error-state" id="rpErrorState" hidden>
        <div class="rp-error-icon" aria-hidden="true">⚠️</div>
        <h2>קישור לא תקין</h2>
        <p id="rpErrorMsg">הקישור לאיפוס הסיסמה אינו תקין או שפג תוקפו. יש לבקש קישור חדש.</p>
        <a class="rp-link" href="../index.html">חזרה לדף הבית</a>
      </div>

      <!-- Set new password form (hidden by default) -->
      <div id="rpFormWrap" hidden>
        <h1 class="rp-title">הגדרת סיסמה חדשה</h1>
        <p class="rp-subtitle">בחרו סיסמה חדשה לחשבונכם. לפחות 6 תווים.</p>

        <form class="rp-form" id="rpForm" novalidate>
          <div class="rp-field">
            <label class="rp-label" for="rpPw">סיסמה חדשה</label>
            <input
              class="rp-input"
              id="rpPw"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="לפחות 6 תווים"
              aria-describedby="rpStatus"
            >
          </div>
          <div class="rp-field">
            <label class="rp-label" for="rpPw2">אישור סיסמה</label>
            <input
              class="rp-input"
              id="rpPw2"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="הזן שוב את הסיסמה"
            >
          </div>

          <button type="submit" class="rp-submit" id="rpSubmit">שמור סיסמה חדשה</button>
          <div class="rp-status" id="rpStatus" role="status" aria-live="polite"></div>
        </form>

        <p class="rp-back"><a href="../index.html">חזרה לדף הבית</a></p>
      </div>

    </div>
  </main>

  <!-- Script loading order mirrors quiz.html -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase-config.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/global-nav.js" defer></script>
<script src="../js/credit-stamp.js" defer></script>

  <script>
    (function () {
      'use strict';

      /* ---- DOM refs ---- */
      var loadingEl  = document.getElementById('rpLoading');
      var errorEl    = document.getElementById('rpErrorState');
      var errorMsgEl = document.getElementById('rpErrorMsg');
      var formWrap   = document.getElementById('rpFormWrap');
      var form       = document.getElementById('rpForm');
      var pwEl       = document.getElementById('rpPw');
      var pw2El      = document.getElementById('rpPw2');
      var submitBtn  = document.getElementById('rpSubmit');
      var statusEl   = document.getElementById('rpStatus');

      /* ---- Helpers ---- */
      function show(el)  { el.hidden = false; }
      function hide(el)  { el.hidden = true;  }

      function setStatus(msg, isSuccess) {
        statusEl.textContent = msg || '';
        if (isSuccess) statusEl.classList.add('is-success');
        else statusEl.classList.remove('is-success');
      }

      function showError(msg) {
        hide(loadingEl);
        hide(formWrap);
        if (msg) errorMsgEl.textContent = msg;
        show(errorEl);
      }

      function showForm() {
        hide(loadingEl);
        hide(errorEl);
        show(formWrap);
        try { pwEl.focus(); } catch (_) {}
      }

      /* ---- Parse URL hash ---- */
      function parseHash() {
        var hash = window.location.hash.replace(/^#/, '');
        var params = {};
        hash.split('&').forEach(function (part) {
          var idx = part.indexOf('=');
          if (idx === -1) return;
          params[decodeURIComponent(part.slice(0, idx))] =
            decodeURIComponent(part.slice(idx + 1));
        });
        return params;
      }

      /* ---- Initialise ---- */
      function init() {
        var params = parseHash();

        /* Supabase processes the hash tokens via detectSessionInUrl:true.
           We verify type=recovery is present in the hash ourselves; if it
           isn't this page was not reached from a real recovery email. */
        if (!params.access_token || params.type !== 'recovery') {
          showError('קישור לא תקין. בקש קישור חדש.');
          return;
        }

        /* Wait for bwcAuth to finish its getSession() call — it will have
           already consumed the hash and established the recovery session. */
        if (!window.bwcAuth) {
          /* auth.js hasn't loaded yet — retry once the scripts are ready */
          window.addEventListener('load', function () {
            waitForAuth();
          });
          return;
        }
        waitForAuth();
      }

      function waitForAuth() {
        if (!window.bwcAuth) {
          showError('שגיאת טעינה. רענן את הדף ונסה שוב.');
          return;
        }
        window.bwcAuth.ready().then(function () {
          showForm();
        }).catch(function () {
          showError('שגיאת אימות. הקישור אינו תקין או שפג תוקפו.');
        });
      }

      /* ---- Form submit ---- */
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var pw  = pwEl.value || '';
        var pw2 = pw2El.value || '';

        if (!pw) {
          setStatus('יש להזין סיסמה חדשה.');
          pwEl.focus();
          return;
        }
        if (pw.length < 6) {
          setStatus('הסיסמה חייבת להכיל לפחות 6 תווים.');
          pwEl.focus();
          return;
        }
        if (pw !== pw2) {
          setStatus('הסיסמאות אינן תואמות. נסה שוב.');
          pw2El.focus();
          return;
        }

        setStatus('');
        submitBtn.disabled = true;
        submitBtn.textContent = 'שומר…';

        window.bwcSupabase.auth.updateUser({ password: pw })
          .then(function (res) {
            if (res.error) {
              var msg = res.error.message || '';
              if (msg.toLowerCase().includes('same password')) {
                setStatus('הסיסמה החדשה זהה לסיסמה הנוכחית. בחר סיסמה שונה.');
              } else if (msg.toLowerCase().includes('weak')) {
                setStatus('הסיסמה חלשה מדי. בחר סיסמה חזקה יותר.');
              } else {
                setStatus('שגיאה בשמירת הסיסמה. נסה שוב.');
              }
              submitBtn.disabled = false;
              submitBtn.textContent = 'שמור סיסמה חדשה';
              return;
            }

            /* Success */
            setStatus('הסיסמה שונתה בהצלחה! מועבר לדף הבית…', true);
            form.querySelectorAll('input, button').forEach(function (el) {
              el.disabled = true;
            });
            setTimeout(function () {
              window.location.href = '../index.html';
            }, 2000);
          })
          .catch(function () {
            setStatus('שגיאת רשת. נסה שוב.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'שמור סיסמה חדשה';
          });
      });

      /* ---- Kick off ---- */
      /* The defer scripts (supabase-js, supabase-config, auth) run after
         DOMContentLoaded, so we wait for the window load event to be safe. */
      if (document.readyState === 'complete') {
        init();
      } else {
        window.addEventListener('load', init);
      }

    })();
  </script>
</body>
</html>
