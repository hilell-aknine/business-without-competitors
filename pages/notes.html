<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003B46">
    <title>המסמכים שלי - עסק ללא מתחרים</title>
    <meta name="description" content="ההערות שכתבת בשיעורים, מסודרות במסמכים לפי נושא, עם קישור לכל רגע בסרטון.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../css/global-nav.css">
    <link rel="stylesheet" href="../css/auth-modal.css">
    <link rel="stylesheet" href="../css/notes.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100vh;
            font-family: var(--font-body);
            direction: rtl;
            background: #001e24;
            color: #e8f1f2;
            -webkit-text-size-adjust: 100%;
            overflow-x: clip;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
        }
        body::before { width: 420px; height: 420px; background: rgba(0,96,107,.35); top: -120px; inset-inline-start: -100px; }
        body::after  { width: 380px; height: 380px; background: rgba(212,175,55,.12); bottom: -120px; inset-inline-end: -80px; }
        .visually-hidden {
            position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
    <header class="gnav" data-page="notes"></header>
    <main class="nd" id="main">
        <div class="nd-hero">
            <h1><i class="fa-regular fa-folder-open" aria-hidden="true"></i>המסמכים שלי</h1>
            <p>כל הערה שכתבת בשיעור, מסודרת במסמך לפי נושא. לחיצה על הזמן פותחת את השיעור בדיוק ברגע שבו כתבת.</p>
            <p class="nd-status" id="ndStatus" role="status" aria-live="polite"></p>
        </div>
        <div id="ndApp" aria-busy="true"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../js/supabase-config.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/auth-modal.js" defer></script>
    <script src="../js/sync-localstorage.js" defer></script>
    <script src="../js/course-data.js" defer></script>
    <script src="../js/global-nav.js?v=2" defer></script>
    <script src="../js/api-host.js" defer></script>
    <script src="../js/notes-store.js" defer></script>
    <script src="../js/notes-ui.js" defer></script>
    <script src="../js/notes-page.js" defer></script>
    <script src="../js/credit-stamp.js" defer></script>
</body>
</html>
